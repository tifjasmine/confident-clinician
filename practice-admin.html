<body>
  <main class="admin-shell">
    <header class="admin-header"><div><p class="eyebrow">The Confident Clinician</p><h1>Practice Funnel</h1><p>See who requested access, opened an exercise, submitted, subscribed, or joined the community.</p></div><button class="text-button" data-logout hidden>Log out</button></header>
    <section class="login-card" data-login>
      <p class="eyebrow">Private admin</p><h2>Sign in</h2>
      <form data-login-form><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Open dashboard</button><p class="status" data-login-status></p></form>
    </section>
    <section data-dashboard hidden>
      <div class="summary-grid" data-summary></div>
      <div class="toolbar"><label>Filter stage<select data-stage-filter><option value="">All stages</option></select></label><label>Search<input data-search type="search" placeholder="IG handle, keyword, campaign…"></label></div>
      <div class="table-card"><table><thead><tr><th>When</th><th>Instagram</th><th>Stage</th><th>Keyword</th><th>Campaign</th><th>Exercise</th></tr></thead><tbody data-events></tbody></table><p class="empty" data-empty hidden>No matching activity yet.</p></div>
    </section>
  </main>
  <script src="practice-admin.js" defer></script>
</body>
