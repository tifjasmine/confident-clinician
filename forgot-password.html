<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password | The Confident Clinician</title>
  <meta property="og:image" content="https://theconfidentclinician.me/confident-clinician-social.png" />
  <meta property="og:image:width" content="1254" />
  <meta property="og:image:height" content="1254" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://theconfidentclinician.me/confident-clinician-social.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#F6F2EB; --dark:#2A3C2F; --mid:#5A6A52; --accent:#C56A4D; --sand:#EDE5D8; --line:#E2DAD0; --danger:#9B3E2F; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Jost, sans-serif; background: var(--bg); color: var(--dark); }
    .card { width: min(100%, 620px); background: var(--sand); border-left: 4px solid var(--accent); padding: clamp(26px, 5vw, 44px); }
    .eyebrow { margin-bottom: 16px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin-bottom: 14px; font: 400 clamp(40px, 8vw, 66px)/.98 "Cormorant Garamond", serif; }
    p { color: var(--mid); font-size: 16px; font-weight: 300; line-height: 1.75; }
    form { display: grid; gap: 16px; margin-top: 24px; }
    label { display: grid; gap: 7px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    input { min-height: 50px; border: 1px solid var(--line); background: rgba(246,242,235,.82); padding: 13px 14px; color: var(--dark); font: 400 16px Jost, sans-serif; }
    button, a.button { min-height: 50px; border: 0; background: var(--accent); color: var(--bg); padding: 14px 26px; font: 700 12px Jost, sans-serif; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .status { display: none; margin-top: 18px; font-size: 14px; line-height: 1.65; }
    .status.error { color: var(--danger); }
    .status.success { color: var(--dark); }
    .links { margin-top: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Member Portal</p>
    <h1>Reset your password.</h1>
    <p>Enter the email connected to your member account. If an account exists, you’ll get a secure reset link.</p>
    <form data-form>
      <label>
        Email
        <input type="email" name="email" autocomplete="email" required placeholder="you@example.com">
      </label>
      <button type="submit">Send Reset Link</button>
    </form>
    <p class="status" data-status></p>
    <p class="links"><a href="./portal.html">Back to member portal</a></p>
  </main>
  <script>
    const form = document.querySelector('[data-form]');
    const status = document.querySelector('[data-status]');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      const original = button.textContent;
      button.disabled = true;
      button.textContent = 'Sending...';
      status.style.display = 'none';
      try {
        const response = await fetch('/.netlify/functions/request-password-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: new FormData(form).get('email') }),
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.message || 'The reset email could not be sent.');
        status.className = 'status success';
        status.textContent = result.message;
        status.style.display = 'block';
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message || 'Something went wrong.';
        status.style.display = 'block';
      } finally {
        button.disabled = false;
        button.textContent = original;
      }
    });
  </script>
</body>
</html>
