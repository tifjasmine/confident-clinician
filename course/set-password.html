<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Choose Your Password | The Confident Clinician</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/course/styles.css">
</head>
<body>
  <main class="login-page">
    <section class="login-story">
      <div class="wordmark">The Confident Clinician</div>
      <div class="login-copy">
        <p class="eyebrow">Secure Course Access</p>
        <h1>Choose a password <em>you’ll remember.</em></h1>
        <p>This password is managed securely by Supabase and is never saved in Airtable.</p>
      </div>
    </section>
    <section class="login-form-wrap">
      <div class="login-card">
        <p class="eyebrow">Finish Activation</p>
        <h2>Set your password.</h2>
        <p class="supporting">Use at least eight characters. A longer, unique password is even better.</p>
        <form class="form-grid" data-password-form>
          <label>New password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
          <label>Confirm password<input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" required></label>
          <button class="button" type="submit">Save Password</button>
        </form>
        <p class="status" data-password-status role="status"></p>
      </div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(window.location.hash.slice(1));
    const accessToken = params.get("access_token");
    const form = document.querySelector("[data-password-form]");
    const status = document.querySelector("[data-password-status]");
    if (!accessToken) {
      form.hidden = true;
      status.textContent = "This password link is incomplete or expired. Return to the course page and request a new one.";
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = new FormData(form);
      const password = String(data.get("password") || "");
      const confirmation = String(data.get("confirmPassword") || "");
      const button = form.querySelector("button");
      status.textContent = "";
      if (password !== confirmation) {
        status.textContent = "Those passwords do not match.";
        return;
      }
      button.disabled = true;
      try {
        const response = await fetch("/.netlify/functions/course-set-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accessToken, password }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || "Your password could not be saved.");
        status.style.color = "var(--sage)";
        status.innerHTML = 'Your account is ready. <a href="/course/"><strong>Log in to the course.</strong></a>';
        form.hidden = true;
        history.replaceState(null, "", window.location.pathname);
      } catch (error) {
        status.textContent = error.message;
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
