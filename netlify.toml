[build]
  publish = "."
  functions = "netlify/functions"
  command = "node scripts/verify-social-previews.mjs && node scripts/verify-seo.mjs && node scripts/verify-analytics.mjs && node scripts/verify-internal-links.mjs"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
