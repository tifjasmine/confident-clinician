  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');

    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};

      const entry = manifest[uuid];

        const bytes = new Uint8Array(binaryStr.length);

          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);

        resourceBlobs[blobUrls[uuid]] = blob;

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;

    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
    const mobileStyle = document.createElement('style');

        }

        }

        .page [style*="padding:36px 44px"],
        .page [style*="padding:22px 30px"],

        }

        }
      }
    `;
    document.head.appendChild(mobileStyle);
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

7604dcaee725\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f03526b6-a1c5-4a49-8346-ce859b63d609\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5528c2ea-79fb-47ac-97c2-d4b51c0d3a2c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"27eef700-60cf-43c7-808c-20c43657ee20\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    body { margin: 0; background: #E4DCCC; }\n    .page {\n      width: 816px;\n      min-height: 1056px;\n      background: #F5EFE6;\n      color: #2F3A33;\n      font-family: 'Manrope', sans-serif;\n      position: relative;\n      margin: 40px auto;\n      box-shadow: 0 8px 40px rgba(47,58,51,0.15);\n      padding: 72px 76px;\n      box-sizing: border-box;\n      overflow: hidden;\n    }\n    h1, h2, h3 { font-family: 'DM Serif Display', serif; font-weight: 400; margin: 0; }\n    .script { font-family: 'Caveat', cursive; }\n    .serif-italic { font-family: 'Cormorant Garamond', serif; font-style: italic; }\n    .divider { height: 1px; background: linear-gradient(90deg, transparent, #C97B63, transparent); margin: 28px 0; border: none; }\n    .leaf { position: absolute; opacity: 0.35; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#E4DCCC; padding-top: 1px; padding-bottom: 40px;\">\n\n<!-- PAGE 1: COVER -->\n<div class=\"page\" data-screen-label=\"01 Cover\" style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;\">\n  <svg class=\"leaf\" style=\"top:60px; left:60px;\" width=\"70\" height=\"70\" sc-camel-view-box=\"0 0 70 70\"><path d=\"M10 60 Q10 10 60 10\" stroke=\"#7A8E7B\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><path d=\"M10 60 Q30 30 60 10\" stroke=\"#7A8E7B\" stroke-width=\"1.5\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n  <svg class=\"leaf\" style=\"bottom:60px; right:60px; transform: rotate(180deg);\" width=\"70\" height=\"70\" sc-camel-view-box=\"0 0 70 70\"><path d=\"M10 60 Q10 10 60 10\" stroke=\"#C97B63\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><path d=\"M10 60 Q30 30 60 10\" stroke=\"#C97B63\" stroke-width=\"1.5\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n\n  <div style=\"letter-spacing:3px; font-size:12px; color:#C97B63; font-weight:600; text-transform:uppercase;\">A Free Resource &nbsp;•&nbsp; The Confident Clinician<\u002Fdiv>\n\n  <div style=\"margin-top:48px; display:flex; flex-direction:column; gap:14px;\">\n    <h1 style=\"font-size:56px; line-height:1.4;\">The Clinical<\u002Fh1>\n    <h1 style=\"font-size:56px; line-height:1.4;\">Confidence<\u002Fh1>\n    <h1 style=\"font-size:56px; line-height:1.4; color:#C97B63;\">Reset<span style=\"font-size:26px; vertical-align:super;\">™<\u002Fspan><\u002Fh1>\n  <\u002Fdiv>\n\n  <hr class=\"divider\" style=\"width:180px; margin:36px 0;\">\n\n  <p class=\"serif-italic\" style=\"font-size:20px; max-width:480px; line-height:1.6; margin:0;\">A workbook for the moments you leave session wondering…<\u002Fp>\n  <p class=\"script\" style=\"font-size:34px; color:#2F3A33; margin:20px 0 0;\">\"Did I do enough?\"<\u002Fp>\n\n  <p class=\"serif-italic\" style=\"font-size:16px; margin-top:56px; color:#7A8E7B; line-height:1.6;\">Because confidence isn't something you're born with.<br>It's something you practice.<\u002Fp>\n<\u002Fdiv>\n\n<!-- PAGE 2 -->\n<div class=\"page\" data-screen-label=\"02 Before we begin\">\n  <div style=\"font-size:12px; letter-spacing:2px; color:#7A8E7B; font-weight:600; text-transform:uppercase;\">Page 02<\u002Fdiv>\n  <h2 style=\"font-size:32px; margin-top:18px;\">Before we begin…<\u002Fh2>\n  <hr class=\"divider\" style=\"width:120px; margin-left:0;\">\n\n  <p style=\"font-size:17px; line-height:1.85; max-width:600px;\">If you're opening this after replaying a session in your head…<br>wondering if you talked too much.<br>Or not enough.<br>Wondering if your client deserved someone \"better.\"<br>Questioning whether you missed something important.<\u002Fp>\n\n  <p style=\"font-size:17px; line-height:1.85; max-width:600px;\">I want you to hear this first.<\u002Fp>\n\n  <div style=\"background:#EFE7D8; border-radius:20px; padding:36px 44px; margin-top:32px;\">\n    <h3 style=\"font-size:26px; color:#C97B63;\">You're not a bad therapist.<br>You were not fully prepared.<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.8; margin-top:20px;\">Therapy is one of the few professions where you're expected to make hundreds of tiny clinical decisions with no answer key. No certainty. No script. Just your judgment.<\u002Fp>\n    <p style=\"font-size:16px; line-height:1.8;\">The goal isn't to eliminate uncertainty. The goal is to learn how to stay grounded inside it.<\u002Fp>\n    <p class=\"script\" style=\"font-size:28px; color:#7A8E7B; margin-top:12px;\">That... is confidence.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PAGE 3 -->\n<div class=\"page\" data-screen-label=\"03 Why it feels convincing\">\n  <div style=\"font-size:12px; letter-spacing:2px; color:#7A8E7B; font-weight:600; text-transform:uppercase;\">Page 03<\u002Fdiv>\n  <h2 style=\"font-size:30px; margin-top:18px; max-width:560px;\">Why imposter syndrome feels so convincing<\u002Fh2>\n  <hr class=\"divider\" style=\"width:120px; margin-left:0;\">\n\n  <div style=\"display:flex; flex-direction:column; gap:22px; margin-top:8px;\">\n    <div style=\"background:#EFE7D8; border-radius:16px; padding:22px 30px;\">\n      <p style=\"font-size:16px; margin:0;\"><span style=\"color:#C97B63; font-weight:700;\">✕<\u002Fspan> \"I don't know enough.\"<\u002Fp>\n      <p style=\"font-size:15px; margin:10px 0 0; color:#556155;\"><span style=\"color:#7A8E7B; font-weight:700;\">Reality —<\u002Fspan> You don't know everything. No therapist does.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#EFE7D8; border-radius:16px; padding:22px 30px;\">\n      <p style=\"font-size:16px; margin:0;\"><span style=\"color:#C97B63; font-weight:700;\">✕<\u002Fspan> \"I should have said something different.\"<\u002Fp>\n      <p style=\"font-size:15px; margin:10px 0 0; color:#556155;\"><span style=\"color:#7A8E7B; font-weight:700;\">Reality —<\u002Fspan> You're noticing opportunities to grow. Not proving you're a fraud.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#EFE7D8; border-radius:16px; padding:22px 30px;\">\n      <p style=\"font-size:16px; margin:0;\"><span style=\"color:#C97B63; font-weight:700;\">✕<\u002Fspan> \"They didn't get better today.\"<\u002Fp>\n      <p style=\"font-size:15px; margin:10px 0 0; color:#556155;\"><span style=\"color:#7A8E7B; font-weight:700;\">Reality —<\u002Fspan> Healing rarely happens in one session. Sometimes the work is simply helping someone feel less alone.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p class=\"serif-italic\" style=\"font-size:18px; margin-top:36px; line-height:1.7; max-width:600px;\">Remember: imposter syndrome doesn't mean you're unqualified. It usually means you're holding yourself to impossible standards.<\u002Fp>\n<\u002Fdiv>\n\n<!-- PAGE 4 -->\n<div class=\"page\" data-screen-label=\"04 RESET Method\">\n  <div style=\"font-size:12px; letter-spacing:2px; color:#7A8E7B; font-weight:600; text-transform:uppercase;\">Page 04<\u002Fdiv>\n  <h2 style=\"font-size:32px; margin-top:18px;\">Meet the RESET Method<span style=\"font-size:16px; vertical-align:super;\">™<\u002Fspan><\u002Fh2>\n  <p class=\"serif-italic\" style=\"font-size:16px; color:#7A8E7B; margin-top:8px;\">A 5-minute practice for after difficult sessions.<\u002Fp>\n  <hr class=\"divider\" style=\"width:120px; margin-left:0;\">\n\n  <div style=\"display:flex; flex-direction:column; gap:16px;\">\n    <div style=\"display:flex; gap:20px; align-items:flex-start;\">\n      <div style=\"font-family:'DM Serif Display',serif; font-size:38px; color:#C97B63; width:52px; flex-shrink:0;\">R<\u002Fdiv>\n      <div><div style=\"font-size:18px; font-weight:700;\">Recognize<\u002Fdiv><p style=\"font-size:15px; margin:6px 0 0; line-height:1.6;\">\"I'm having the thought that I failed.\" Notice the thought. Don't become the thought.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:20px; align-items:flex-start;\">\n      <div style=\"font-family:'DM Serif Display',serif; font-size:38px; color:#C97B63; width:52px; flex-shrink:0;\">E<\u002Fdiv>\n      <div><div style=\"font-size:18px; font-weight:700;\">Examine<\u002Fdiv><p style=\"font-size:15px; margin:6px 0 0; line-height:1.6;\">What actually happened? Stick to facts. Not interpretations.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:20px; align-items:flex-start;\">\n      <div style=\"font-family:'DM Serif Display',serif; font-size:38px; color:#C97B63; width:52px; flex-shrink:0;\">S<\u002Fdiv>\n      <div><div style=\"font-size:18px; font-weight:700;\">Support<\u002Fdiv><p style=\"font-size:15px; margin:6px 0 0; line-height:1.6;\">List three things you genuinely offered your client today. Even if they feel small.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:20px; align-items:flex-start;\">\n      <div style=\"font-family:'DM Serif Display',serif; font-size:38px; color:#C97B63; width:52px; flex-shrink:0;\">E<\u002Fdiv>\n      <div><div style=\"font-size:18px; font-weight:700;\">Expand<\u002Fdiv><p style=\"font-size:15px; margin:6px 0 0; line-height:1.6;\">What are three other explanations besides \"I'm a terrible therapist\"?<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:20px; align-items:flex-start;\">\n      <div style=\"font-family:'DM Serif Display',serif; font-size:38px; color:#C97B63; width:52px; flex-shrink:0;\">T<\u002Fdiv>\n      <div><div style=\"font-size:18px; font-weight:700;\">Trust<\u002Fdiv><p style=\"font-size:15px; margin:6px 0 0; line-height:1.6;\">One session never defines a therapist. Keep showing up.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PAGE 5: Session Debrief worksheet -->\n<div class=\"page\" data-screen-label=\"05 Session Debrief\">\n  <div style=\"font-size:12px; letter-spacing:2px; color:#7A8E7B; font-weight:600; text-transform:uppercase;\">Page 05 · Worksheet<\u002Fdiv>\n  <h2 style=\"font-size:32px; margin-top:18px;\">Session Debrief<\u002Fh2>\n  <hr class=\"divider\" style=\"width:120px; margin-left:0;\">\n\n  <div style=\"border:1px solid #C97B63; border-radius:6px; padding:8px 18px; display:inline-block; font-size:15px; color:#7A8E7B;\">Today's client: ________________________________<\u002Fdiv>\n\n  <div style=\"display:flex; flex-direction:column; gap:26px; margin-top:36px;\">\n    <div>\n      <div style=\"font-size:16px; font-weight:700; color:#2F3A33;\">One thing I did well<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #C97B63; height:36px; margin-top:8px;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:16px; font-weight:700; color:#2F3A33;\">One moment I stayed present<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #C97B63; height:36px; margin-top:8px;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:16px; font-weight:700; color:#2F3A33;\">One thing I'll try next session<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #C97B63; height:36px; margin-top:8px;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:16px; font-weight:700; color:#2F3A33;\">One reminder I need to hear right now<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #C97B63; height:36px; margin-top:8px;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PAGE 6 -->\n<div class=\"page\" data-screen-label=\"06 Common lies\">\n  <div style=\"font-size:12px; letter-spacing:2px; color:#7A8E7B; font-weight:600; text-transform:uppercase;\">Page 06<\u002Fdiv>\n  <h2 style=\"font-size:30px; margin-top:18px; max-width:560px;\">Common lies your inner critic tells you<\u002Fh2>\n  <hr class=\"divider\" style=\"width:120px; margin-left:0;\">\n\n  <div style=\"display:flex; flex-direction:column; gap:18px;\">\n    <div style=\"background:#EFE7D8; border-radius:16px; padding:18px 28px;\"><p style=\"margin:0; font-size:15px;\"><span style=\"color:#C97B63; font-weight:700;\">✕<\u002Fspan> I talked too much.<\u002Fp><p style=\"margin:8px 0 0; font-size:15px; color:#556155;\"><span style=\"color:#7A8E7B; font-weight:700;\">✔<\u002Fspan> Maybe your client needed more guidance today.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#EFE7D8; border-radius:16px; padding:18px 28px;\"><p style=\"margin:0; font-size:15px;\"><span style=\"color:#C97B63; font-weight:700;\">✕<\u002Fspan> I didn't say enough.<\u002Fp><p style=\"margin:8px 0 0; font-size:15px; color:#556155;\"><span style=\"color:#7A8E7B; font-weight:700;\">✔<\u002Fspan> Sometimes presence is more healing than words.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#EFE7D8; border-radius:16px; padding:18px 28px;\"><p style=\"margin:0; font-size:15px;\"><span style=\"color:#C97B63; font-weight:700;\">✕<\u002Fspan> They cried because I handled it wrong.<\u002Fp><p style=\"margin:8px 0 0; font-size:15px; color:#556155;\"><span style=\"color:#7A8E7B; font-weight:700;\">✔<\u002Fspan> Or maybe they finally felt safe enough to cry.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#EFE7D8; border-radius:16px; padding:18px 28px;\"><p style=\"margin:0; font-size:15px;\"><span style=\"color:#C97B63; font-weight:700;\">✕<\u002Fspan> I forgot the perfect intervention.<\u002Fp><p style=\"margin:8px 0 0; font-size:15px; color:#556155;\"><span style=\"color:#7A8E7B; font-weight:700;\">✔<\u002Fspan> There usually isn't one.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#EFE7D8; border-radius:16px; padding:18px 28px;\"><p style=\"margin:0; font-size:15px;\"><span style=\"color:#C97B63; font-weight:700;\">✕<\u002Fspan> Everyone else knows what they're doing.<\u002Fp><p style=\"margin:8px 0 0; font-size:15px; color:#556155;\"><span style=\"color:#7A8E7B; font-weight:700;\">✔<\u002Fspan> Every experienced therapist once wondered if they belonged.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PAGE 7 -->\n<div class=\"page\" data-screen-label=\"07 Save these\">\n  <svg class=\"leaf\" style=\"top:70px; right:70px;\" width=\"60\" height=\"60\" sc-camel-view-box=\"0 0 70 70\"><path d=\"M10 60 Q10 10 60 10\" stroke=\"#7A8E7B\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><path d=\"M10 60 Q30 30 60 10\" stroke=\"#7A8E7B\" stroke-width=\"1.5\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n  <div style=\"font-size:12px; letter-spacing:2px; color:#7A8E7B; font-weight:600; text-transform:uppercase;\">Page 07<\u002Fdiv>\n  <h2 style=\"font-size:32px; margin-top:18px;\">Save these.<\u002Fh2>\n  <p class=\"serif-italic\" style=\"font-size:16px; color:#7A8E7B;\">(Think sticky notes.)<\u002Fp>\n  <hr class=\"divider\" style=\"width:120px; margin-left:0;\">\n\n  <div style=\"display:flex; flex-direction:column; gap:22px; margin-top:12px;\">\n    <p style=\"font-size:19px; margin:0;\">📌 Presence is an intervention.<\u002Fp>\n    <p style=\"font-size:19px; margin:0;\">📌 Curiosity is more powerful than certainty.<\u002Fp>\n    <p style=\"font-size:19px; margin:0;\">📌 You don't have to earn the right to be compassionate toward yourself.<\u002Fp>\n    <p style=\"font-size:19px; margin:0;\">📌 Every session teaches you something.<\u002Fp>\n    <p style=\"font-size:19px; margin:0;\">📌 Confidence grows through repetition — not perfection.<\u002Fp>\n    <p style=\"font-size:19px; margin:0;\">📌 Your client doesn't need a perfect therapist.<br><span class=\"script\" style=\"font-size:26px; color:#C97B63;\">They need a present one.<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PAGE 8: Reflection worksheet -->\n<div class=\"page\" data-screen-label=\"08 Reflection\">\n  <div style=\"font-size:12px; letter-spacing:2px; color:#7A8E7B; font-weight:600; text-transform:uppercase;\">Page 08 · Worksheet<\u002Fdiv>\n  <h2 style=\"font-size:32px; margin-top:18px;\">Reflection<\u002Fh2>\n  <p class=\"serif-italic\" style=\"font-size:16px; color:#7A8E7B;\">Complete these sentences.<\u002Fp>\n  <hr class=\"divider\" style=\"width:120px; margin-left:0;\">\n\n  <div style=\"display:flex; flex-direction:column; gap:30px; margin-top:20px;\">\n    <div>\n      <div style=\"font-size:16px; font-weight:700;\">Today I learned...<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #C97B63; height:38px; margin-top:8px;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:16px; font-weight:700;\">One thing I'm proud of...<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #C97B63; height:38px; margin-top:8px;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:16px; font-weight:700;\">One fear I'm ready to release...<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #C97B63; height:38px; margin-top:8px;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:16px; font-weight:700;\">The therapist I'm becoming is someone who...<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #C97B63; height:38px; margin-top:8px;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PAGE 9: CTA -->\n<div class=\"page\" data-screen-label=\"09 CTA\" style=\"display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;\">\n  <svg class=\"leaf\" style=\"top:60px; left:60px;\" width=\"60\" height=\"60\" sc-camel-view-box=\"0 0 70 70\"><path d=\"M10 60 Q10 10 60 10\" stroke=\"#C97B63\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><path d=\"M10 60 Q30 30 60 10\" stroke=\"#C97B63\" stroke-width=\"1.5\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n  <div style=\"font-size:12px; letter-spacing:2px; color:#7A8E7B; font-weight:600; text-transform:uppercase;\">If this workbook helped...<\u002Fdiv>\n  <p class=\"serif-italic\" style=\"font-size:20px; margin-top:20px; max-width:480px;\">Imagine what 60 minutes could do.<\u002Fp>\n\n  <h2 style=\"font-size:28px; margin-top:24px; max-width:520px; line-height:1.3;\">The 5 Skills That Separate New Therapists from Confident Clinicians<\u002Fh2>\n\n  <hr class=\"divider\" style=\"width:180px;\">\n\n  <div style=\"text-align:left; display:flex; flex-direction:column; gap:14px; font-size:16px;\">\n    <p style=\"margin:0;\"><span style=\"color:#7A8E7B; font-weight:700;\">✓<\u002Fspan> How confident therapists actually think<\u002Fp>\n    <p style=\"margin:0;\"><span style=\"color:#7A8E7B; font-weight:700;\">✓<\u002Fspan> What to do when clients say \"I don't know.\"<\u002Fp>\n    <p style=\"margin:0;\"><span style=\"color:#7A8E7B; font-weight:700;\">✓<\u002Fspan> How to stop replaying sessions<\u002Fp>\n    <p style=\"margin:0;\"><span style=\"color:#7A8E7B; font-weight:700;\">✓<\u002Fspan> The confidence-building skills grad school rarely teaches<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:44px; background:#2F3A33; color:#F5EFE6; border-radius:40px; padding:18px 40px;\">\n    <div style=\"font-size:20px; font-weight:700; letter-spacing:0.5px;\">Follow @TheConfidentClinician<\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"serif-italic\" style=\"font-size:15px; color:#7A8E7B; margin-top:20px;\">The things they should have taught us in grad school.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
